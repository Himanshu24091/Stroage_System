<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stealth Cloud Storage Vault - Direct streaming and storage system for large files">
    <title>{% block title %}{{ app_title | default('Stealth Storage Vault') }}{% endblock %}</title>

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-wrapper">
        <!-- Top Navigation Bar -->
        <header class="navbar-glass">
            <div class="nav-container">
                <a href="/" class="brand-logo">
                    <div class="logo-icon-box">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">STEALTH<span class="brand-accent">VAULT</span></span>
                        <span class="brand-badge">PRO</span>
                    </div>
                </a>

                <div class="nav-actions">
                    <div class="stealth-indicator" title="Office Proxy Streamer Active">
                        <span class="pulse-dot"></span>
                        <span class="indicator-label">Proxy Active</span>
                    </div>

                    {% if enable_auth %}
                    <button id="logoutBtn" class="btn-ghost" title="Lock Vault">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        <span>Lock</span>
                    </button>
                    {% endif %}
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- Toast Notifications Container -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Core Scripts -->
    {% block extra_js %}{% endblock %}
</body>
</html>
