<!-- Universal Media Preview Modal -->
<div id="previewModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog glass-panel">
        <div class="modal-header">
            <div class="modal-title-box">
                <span id="previewCategoryBadge" class="badge">MEDIA</span>
                <h3 id="previewTitle" class="modal-filename" title="File Name">File Preview</h3>
            </div>
            <div class="modal-controls">
                <a id="previewDownloadDirect" href="#" class="btn-icon" title="Direct Stealth Download">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </a>
                <button id="closePreviewBtn" class="btn-icon close-btn" title="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="modal-body" id="previewContainer">
            <!-- Dynamic Content Injected Here -->
            <div class="preview-spinner" id="previewLoading">
                <div class="spinner-ring"></div>
                <span>Streaming media via stealth proxy...</span>
            </div>
        </div>

        <div class="modal-footer">
            <div class="file-meta-info">
                <span id="previewFileSize">0 MB</span>
                <span class="meta-dot">•</span>
                <span id="previewSourceType">Drive Link</span>
            </div>
            <div class="footer-actions">
                <button id="copyStreamLinkBtn" class="btn-secondary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <span>Copy Proxy Link</span>
                </button>
            </div>
        </div>
    </div>
</div>
