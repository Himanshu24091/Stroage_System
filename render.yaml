services:
  - type: web
    name: stealth-storage-vault
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 300
    plan: free
    envVars:
      - key: ENABLE_AUTH
        value: "False"
      - key: MASTER_PIN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stealth-vault-db
          property: connectionString
      - key: GAS_WEBHOOK_URL
        sync: false

databases:
  - name: stealth-vault-db
    plan: free
    databaseName: vault_db
    user: vault_user
