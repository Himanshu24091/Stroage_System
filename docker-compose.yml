version: '3.8'

services:
  web:
    build: .
    container_name: stealth_storage_vault
    ports:
      - "5000:5000"
    environment:
      - ENABLE_AUTH=False
      - MASTER_PIN=1234
      - SECRET_KEY=super-secret-dev-key-change-in-prod
      - DATABASE_URL=postgresql://vault_user:vault_pass@db:5432/vault_db
      - GAS_WEBHOOK_URL=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: stealth_storage_postgres
    environment:
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_pass
      POSTGRES_DB: vault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d vault_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
